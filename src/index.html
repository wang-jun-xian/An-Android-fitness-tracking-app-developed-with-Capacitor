<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3f4f9" />
<title>云舟健身</title>
<style>
/* ===== 基础 ===== */
:root{
  --bg:#f3f4f9; --card:#ffffff; --border:#e5e7eb;
  --txt:#1f2937; --muted:#6b7280; --danger:#e53e3e;
  --cmn:#f4b83b; --ok:#22c55e; --okbg:#16a34a;
  --shadow:0 2px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#app{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);
  overflow:hidden;user-select:none;-webkit-user-select:none;
  /* 安全区：确保内容不被状态栏/底部导航遮挡 */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{display:flex;flex-direction:column}
.hidden{display:none!important}

/* ===== 顶部标题栏 ===== */
.topbar{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--card);border-bottom:1px solid var(--border);
  flex:none;min-height:48px;
}
/* 标题在顶栏水平居中（日历/个人栏无右侧按钮时也居中） */
.topbar .title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-weight:700;font-size:17px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:calc(100% - 140px);pointer-events:auto;
}
.topbar .title.editable{cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px}
.btn{
  border:none;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;
  background:#eef0f5;color:var(--txt);transition:background .15s;
}
.btn:active{background:#dde1ea}
.btn.primary{background:#4f6ef7;color:#fff}
.btn.danger{background:#fee2e2;color:var(--danger)}
.btn.tw{background:#7c3aed;color:#fff}
.btn:disabled{opacity:.5}

/* ===== 内容区 ===== */
main{flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column;min-height:0}
.page{display:none;flex:1;min-height:0}
.page.active{display:flex;flex-direction:column}
/* 计划页：整页自管滚动（拖拽需要） */
#page-tiles.active{
  display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:none;
}
/* 日历页：整页不滚，只让打卡明细列表滚 */
#page-cal.active{overflow:hidden;touch-action:auto;display:flex;flex-direction:column}
/* 我的页：原生滚动 */
#page-me.active{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:block}

/* ===== 磁贴 ===== */
.tile{
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  padding:12px;margin:0 0 10px;position:relative;
  box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;
  touch-action:none;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
.tile .tile-head{display:flex;align-items:center;gap:8px}
.tile .index{font-size:11px;color:var(--muted);min-width:14px}
.tile .tile-name{flex:1;font-weight:600;font-size:15px;word-break:break-word}
.tile .tile-actions{display:flex;gap:6px;flex:none}
.tile-btn{
  width:30px;height:30px;border-radius:8px;border:none;font-size:15px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
}
.tile-btn.set{background:#eef0f5;color:#374151}
.check-btn{
  background:var(--cmn);color:#5c4300;
}
.tile.done .check-btn{background:var(--okbg);color:#fff}
.check-mark{font-size:15px}
del-btn,.del-btn{background:#fde8e8;color:var(--danger)}
.tile.done {opacity:.85}
.done-row{position:absolute;right:10px;top:8px}
/* 完成遮罩：置灰 */
.tile.done{background:repeating-linear-gradient(45deg,#ebedf2,#ebedf2 6px,#e4e6ec 6px,#e4e6ec 12px)}
.tile.done .tile-name{color:var(--muted)}
.tile .sub-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid #e6e8f0}

/* 拖拽样式 */
.tile.sorting{box-shadow:0 8px 20px rgba(0,0,0,.16);z-index:10;position:relative}
.tile.placeholder{opacity:.3}
/* 子磁贴 */
.sub-tile{
  display:flex;align-items:center;gap:8px;background:#f7f8fb;border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;position:relative;touch-action:none;
}
.sub-tile .sub-name{flex:1;font-size:14px}
.sub-tile .sub-del{width:24px;height:24px;border:none;border-radius:6px;background:#fde8e8;color:var(--danger);font-size:12px;cursor:pointer}
.sub-tile.done{background:#e8f5ec}
.sub-tile.done .sub-name{color:var(--muted)}
.sub-check{width:26px;height:26px;border:none;border-radius:7px;background:var(--cmn);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#5c4300}
.sub-check.done{background:var(--okbg);color:#fff}

/* 磁贴色块 / 计数 / 运动按钮 */
.mini-chip{width:30px;height:30px;border-radius:8px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.tile .cnt{font-size:11px;color:var(--muted);background:#f1f2f6;padding:2px 6px;border-radius:20px;flex:none}
.wb-btn{border:none;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;background:#eef0f5;color:var(--txt);flex:none}
.wb-btn.on{background:#7c3aed;color:#fff}
.tile.session{border-color:#7c3aed;box-shadow:0 0 0 2px rgba(124,58,237,.15)}
.desc{font-size:12px;color:var(--muted);margin-top:6px}
/* 拖拽把手 */
.drag-handle{
  width:32px;height:30px;border:none;border-radius:8px;background:#eef0f5;color:#6b7280;
  font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;flex:none;-webkit-user-select:none;user-select:none;
}
.drag-handle:active{background:#dde1ea;cursor:grabbing}

/* 拖拽 */
.tile.dragging{
  box-shadow:0 14px 28px rgba(0,0,0,.25);opacity:.96;transition:none;cursor:grabbing;
  will-change:transform;z-index:900;touch-action:none;pointer-events:none;
}
html.drag-lock,html.drag-lock body,html.drag-lock main{overflow:hidden!important;touch-action:none!important}
.tile-placeholder{opacity:.3;background:#dbe1f8;border:2px dashed #4f6ef7;border-radius:13px}
.tile.reflowing{transition:none;will-change:transform}

/* ===== 弹窗 ===== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;
}
.modal{
  background:#fff;border-radius:14px;padding:18px;max-width:320px;width:calc(100% - 40px);
  animation:pop .18s ease;box-shadow:0 10px 30px rgba(0,0,0,.2);
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin-bottom:8px;font-size:16px}
.modal p{font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.5;white-space:pre-line}
.modal .actions{display:flex;gap:8px;justify-content:flex-end}
.modal .actions .btn{flex:1}

/* ===== 编辑面板 ===== */
.edit-body{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent}
.swatch.sel{border-color:#333}
.edit-sub{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.edit-sub span{flex:1;font-size:13px}

/* ===== 回收站 ===== */
.bin-item{padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bin-item .bin-name{flex:1;font-size:14px}
.bin-item .bin-meta{font-size:11px;color:var(--muted)}

/* ===== 日历 ===== */
.cal-stats{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px;margin-bottom:12px;font-size:14px;color:var(--muted);
}
.cal-stats .num{font-size:22px;font-weight:700;color:#4f6ef7;min-width:1.5em;text-align:center}
.cal-head{display:grid;grid-template-columns:72px 1fr 96px;align-items:center;gap:6px;margin-bottom:10px}
.cal-head .btn{width:34px;height:34px;padding:0}
.cal-title{font-weight:700;font-size:16px;text-align:center}
.cal-right{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.cal-right .btn{width:auto;padding:0 10px;height:34px;font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day.selected{outline:2px solid #4f6ef7;outline-offset:-2px}
.cal-detail{
  margin-top:14px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px;min-height:120px;max-height:min(52vh,380px);
  display:flex;flex-direction:column;overflow:hidden;
}
.cal-log-list{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  touch-action:pan-y !important;
}
.cal-log-list::-webkit-scrollbar{width:4px}
.cal-log-list::-webkit-scrollbar-thumb{background:#d0d5dd;border-radius:4px}
.cal-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex:none}
.cal-detail-head h3{font-size:15px;font-weight:700}
.cal-detail-head .cnt{font-size:12px;color:var(--muted)}
.cal-log-item{
  display:flex;align-items:center;gap:8px;padding:10px 8px;
  border-bottom:1px solid var(--border);font-size:14px;
}
.cal-log-item:last-child{border-bottom:none}
.cal-log-item .label{flex:1;word-break:break-word}
.cal-log-item .ts{font-size:11px;color:var(--muted);flex:none}
.cal-log-item .del-x{
  width:28px;height:28px;border:none;border-radius:8px;background:#fde8e8;
  color:var(--danger);font-size:14px;cursor:pointer;flex:none;
}
.cal-empty{
  text-align:center;padding:28px 0 18px;color:#9aa3b2;
  font-family:Georgia,'Songti SC','SimSun',serif;font-size:22px;letter-spacing:8px;
}
.cal-day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:14px;cursor:pointer}
.cal-day.dim{color:#adb3bd}
.cal-day.today{border:2px solid #4f6ef7}
.cal-day.done{background:var(--okbg);color:#fff;font-weight:600}
.cal-day.done .cal-tag{font-size:10px}
.cal-tag{font-size:10px;color:var(--okbg);margin-top:1px}

/* ===== 底部导航 ===== */
.tabbar{
  flex:none;display:flex;background:#fff;border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .tab{
  flex:1;padding:10px 0;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;
}
.tabbar .tab.active{color:#4f6ef7;font-weight:600}
.tabbar .tab .ico{font-size:20px;display:block;margin-bottom:2px}

/* ===== 个人页 ===== */
.me-sec-title{font-size:13px;color:var(--muted);margin:6px 0 8px;padding-left:4px}
.me-card{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px;margin-bottom:10px;font-size:15px;cursor:pointer;
}
.me-card .me-arrow{color:#c1c6d0;font-size:18px}

/* ===== 动作参数 / 历史（磁贴第二行） ===== */
.ex-line{font-size:12px;color:#4f6ef7;background:#eef2ff;border-radius:6px;
  padding:3px 8px;margin-top:7px;display:inline-block}
.hist-line{font-size:11px;color:var(--muted);margin-top:5px}
.hist-line b{color:#b7791f;font-weight:600}

/* 编辑面板：动作参数每行一项（上下排列） */
.exf{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.exf>label{width:4.5em;font-size:13px;color:var(--muted);flex:none}
.exf input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;text-align:center}
.exf input:focus{outline:none;border-color:#4f6ef7}
.exf .sr-unit{flex:none}
.exf-u{font-size:12px;color:var(--muted);flex:none}

/* 数字输入：左右步进按钮（移动端 WebView 不渲染原生上下箭头） */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.stp{
  width:36px;height:36px;flex:none;border:none;border-radius:9px;
  background:#eef0f5;color:#374151;font-size:19px;line-height:1;
  cursor:pointer;touch-action:manipulation;
}
.stp:active{background:#cdd6f7;color:#1d2a5e}

/* ===== 记组弹窗 ===== */
.sr-target{font-size:12px;color:#4f6ef7;background:#eef2ff;border-radius:8px;
  padding:6px 10px;margin-bottom:10px}
.sr-cur{display:flex;flex-direction:column;gap:6px}
.sr-cur .exf{margin-bottom:0}
.sr-unit{
  border:1px solid var(--border);border-radius:8px;padding:8px 8px;font-size:13px;
  background:#eef0f5;cursor:pointer;color:var(--txt);min-width:40px;flex:none;
}
.pill{
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;
  background:#fff;color:var(--muted);cursor:pointer;flex:none;
}
.pill.on{background:#f4b83b;color:#5c4300;border-color:#f4b83b;font-weight:600}
.sr-list{margin:10px 0;max-height:26vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sr-row{
  display:flex;align-items:center;gap:8px;background:#f7f8fb;border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:14px;
}
.sr-row .no{color:#9aa3b2;font-size:12px;min-width:14px}
.sr-row .rm{margin-left:auto;border:none;background:#fde8e8;color:var(--danger);
  border-radius:6px;width:26px;height:26px;font-size:12px;cursor:pointer}
.sr-row.wu{opacity:.65}
.sr-row .wutag{font-size:10px;color:#b7791f;background:#fff4dc;border-radius:4px;padding:1px 4px}

/* ===== 组间休息计时条 ===== */
#timerBar{
  position:fixed;left:12px;right:12px;z-index:70;
  bottom:calc(62px + env(safe-area-inset-bottom));
  background:#111827;color:#fff;border-radius:13px;padding:2px 12px 8px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#timerBar.done{background:#16a34a}
.tb-prog{height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.tb-prog i{display:block;height:100%;background:#f4b83b;border-radius:2px;transition:width .2s linear}
.tb-row{display:flex;align-items:center;gap:8px}
.tb-row .tb-label{font-size:13px;flex:1}
.tb-row b{font-size:22px;font-variant-numeric:tabular-nums;min-width:1.6em;text-align:center}
.tb-row .tb-u{font-size:12px;color:#9ca3af;margin-right:4px}
.tb-btn{
  border:none;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;
  font-size:12px;padding:6px 10px;cursor:pointer;
}
.tb-btn:active{background:rgba(255,255,255,.28)}

/* ===== 动作详情弹窗 ===== */
.dt-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dt-name{font-size:16px;font-weight:700;flex:1;word-break:break-word}
.dt-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.dt-stat{background:#f7f8fb;border:1px solid var(--border);border-radius:9px;padding:7px 4px;text-align:center}
.dt-stat .v{font-size:15px;font-weight:700;color:#4f6ef7}
.dt-stat .k{font-size:10px;color:var(--muted);margin-top:2px}
.dt-chart{background:#f7f8fb;border:1px solid var(--border);border-radius:10px;padding:8px;margin-bottom:10px}
.dt-chart svg{display:block;width:100%;height:auto}
.dt-hist{max-height:30vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.dt-hist-item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px}
.dt-hist-item .dt-hist-top{display:flex;align-items:center;gap:8px}
.dt-hist-item .dt-hist-top b{flex:1}
.dt-hist-item .dt-hist-sets{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-all}

/* ===== 日历明细：组 chips ===== */
.cal-log-item{flex-direction:column;align-items:stretch;gap:4px}
.cal-log-item .log-main{display:flex;align-items:center;gap:8px;width:100%}
.set-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding-left:2px}
.set-chip{
  font-size:11px;background:#eef2ff;color:#4f6ef7;border-radius:5px;padding:2px 6px;
  font-variant-numeric:tabular-nums;
}
.set-chip.wu{background:#f4f0e6;color:#b7791f}
.ton-chip{font-size:11px;color:#16a34a;font-weight:600}

/* ===== 统计弹窗 ===== */
.st-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.st-num{background:#f7f8fb;border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center}
.st-num .v{font-size:20px;font-weight:700;color:#4f6ef7}
.st-num .k{font-size:11px;color:var(--muted);margin-top:3px}
.st-sec{font-size:12px;color:var(--muted);margin:12px 0 6px}
.st-bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:4px 2px 0}
.st-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.st-bar i{display:block;width:100%;background:#4f6ef7;border-radius:4px 4px 0 0;min-height:2px}
.st-bar .lb{font-size:9px;color:var(--muted);white-space:nowrap}
.st-bar .vv{font-size:9px;color:#4f6ef7;white-space:nowrap}
.st-cat{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.st-cat .nm{width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-cat .bar-bg{flex:1;height:10px;background:#f1f2f6;border-radius:5px;overflow:hidden}
.st-cat .bar-bg i{display:block;height:100%;border-radius:5px}
.st-cat .pct{font-size:11px;color:var(--muted);min-width:3em;text-align:right}
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <button class="btn" id="btnBack" title="返回上一级">‹ 返回</button>
    <span class="title" id="topTitle">多套健身方案</span>
    <div id="topActions" style="display:flex;gap:6px">
      <button class="btn primary" id="btnAdd">＋ 添加</button>
    </div>
  </header>

  <main>
    <!-- 页1：磁贴 -->
    <div class="page active" id="page-tiles"></div>
    <!-- 页2：日历 -->
    <div class="page" id="page-cal">
      <div class="cal-stats">已打卡 <span class="num" id="calDoneDays">0</span> 天 · 连续 <span class="num" id="calStreak">0</span> 天</div>
      <div class="cal-head">
        <div class="cal-left"><button class="btn" id="calPrev">‹</button></div>
        <div class="cal-title" id="calTitle"></div>
        <div class="cal-right">
          <button class="btn" id="calToday">定位</button>
          <button class="btn" id="calNext">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-detail" id="calDetail"></div>
    </div>
    <!-- 页3：个人页（回收站/导入导出） -->
    <div class="page" id="page-me"><div id="meBody"></div></div>
  </main>

  <nav class="tabbar">
    <div class="tab active" data-tab="tiles"><span class="ico">🏋️</span>计划</div>
    <div class="tab" data-tab="cal"><span class="ico">📅</span>日历</div>

<script>
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 调色板：全部亮色，无灰黑 */
const PALETTE = ['#ff6b6b','#ff9f43','#feca57','#ffd166','#ff8fab','#ff6bcb','#a29bfe',
  '#6c5ce7','#4f6ef7','#74b9ff','#54a0ff','#0abde3','#00cec9','#1dd1a1','#10ac84','#badc58',
  '#51cf66','#94d82d','#ffe066','#ffa94d','#f783ac','#b197fc','#66d9e8'];
const isBright = c => { try { const d=document.createElement('div');d.style.color=c;return d.style.color!=='';}catch{return true}};

/* ================= 数据模型 ================= */
const DB_KEY='yz_fitness_v1';
let D = null; // {plans:[plan]}
// plan:{id,name,desc?,'items':[tile]}   tile:{id,name,color,subs:[tile],done?}
// 一级磁贴(方案/栏目/动作) 统一结构

let state={path:[], page:'tiles'}; // path 为磁贴栈; page 当前页
let bin=[]; // 回收站 [{tile, parentId, index, ts}]
let workout={}; // 会话标记 {catId:true}

function load(){
  try{ D=JSON.parse(localStorage.getItem(DB_KEY))||defaultData(); }catch(e){ D=defaultData(); }
  if(!D||!Array.isArray(D.plans)) D=defaultData();
  if(!D.title) D.title='多套健身方案';
  bin=(D._bin)||[]; delete D._bin;
}
function save(){
  const copy=JSON.parse(JSON.stringify({...D,_bin:bin}));
  try{ localStorage.setItem(DB_KEY, JSON.stringify(copy)); }catch(e){ /* 空间不足忽略 */ }
}
function defaultData(){
  return {
    plans:[
      {id:uid(),name:'健身方案1',
       subs:[
        {id:uid(),name:'胸肩',color:PALETTE[10],
         subs:[{id:uid(),name:'卧推',color:PALETTE[5],subs:[]},
               {id:uid(),name:'飞鸟',color:PALETTE[11],subs:[]},
               {id:uid(),name:'推举',color:PALETTE[2],subs:[]}]},
        {id:uid(),name:'背肩',color:PALETTE[7],
         subs:[{id:uid(),name:'引体',color:PALETTE[9],subs:[]},
               {id:uid(),name:'划船',color:PALETTE[12],subs:[]},
               {id:uid(),name:'面拉',color:PALETTE[14],subs:[]}]},
        {id:uid(),name:'腿',color:PALETTE[15],
         subs:[{id:uid(),name:'深蹲',color:PALETTE[17],subs:[]},
               {id:uid(),name:'腿举',color:PALETTE[18],subs:[]}]}
       ]}
    ]
  };
}

/* ================= 状态/打卡 推导 ================= */
function setSubtreeDone(t,v){ t.done=!!v; (t.subs||[]).forEach(s=>setSubtreeDone(s,v)); }
// 真正的自动推导：自下而上（子树全打卡 → 父自动打卡；任一未打卡 → 父取消）
function recomputeAll(node){
  if(!node) return;
  if(Array.isArray(node.subs) && node.subs.length){
    for(const s of node.subs) recomputeAll(s);
    node.done = node.subs.every(x=>!!x.done);
  }
  // 叶子(无子项)保持手动状态，不自动推导
}
// 全树统一推导：父级状态=所有子项都已打卡
function recomputeAllTree(){
  for(const p of (D.plans||[])) recomputeAll(p);
  // 运动会话自动结束：某栏目所有子动作都被打卡
  for(const p of (D.plans||[])) for(const c of (p.subs||[])){
    if(workout[c.id] && (c.subs||[]).length && c.subs.every(e=>!!e.done)){
      delete workout[c.id]; c.done=true;
    }
  }
}
function recomputeFromLevel(container){
  for(const t of container) recomputeAll(t);
  recomputeAllTree();
}

/* ================= 定位/查找 ================= */
function getList(){
  if(!state.path.length) return D.plans;
  let node=D.plans.find(p=>p.id===state.path[0]);
  for(let i=1;i<state.path.length;i++) node=(node?node.subs:[]).find(s=>s&&s.id===state.path[i]);
  // 保证返回可写数组引用，否则 push 新磁贴会丢失
  if(!node) return D.plans;
  if(!Array.isArray(node.subs)) node.subs=[];
  return node.subs;
}
function getPathNames(){
  if(!state.path.length) return [];
  const names=[]; let node=D.plans.find(p=>p.id===state.path[0]); if(node) names.push(node.name);
  for(let i=1;i<state.path.length;i++){ node=(node?node.subs:[]).find(s=>s&&s.id===state.path[i]); if(node) names.push(node.name); }
  return names;
}
function findNodeById(id, root){
  if(!id) return null;
  root=root||D;
  // 支持在 {plans:[]} 或纯数组上行走
  const seed = Array.isArray(root) ? root : (Array.isArray(root.plans) ? root.plans : []);
  for(const s of seed){ const r=walk(s); if(r) return r; }
  return null;
  function walk(node){
    if(!node||!node.id) return null;
    if(node.id===id) return node;
    if(Array.isArray(node.subs)) for(const s of node.subs){ const r=walk(s); if(r) return r; }
    return null;
  }
}
function isLeaf(t){ return !t.subs || !t.subs.length }
function countAllSubs(t){ let n=(t.subs||[]).length; for(const s of (t.subs||[])) n+=countAllSubs(s); return n; }
const rndColor=()=>PALETTE[Math.floor(Math.random()*PALETTE.length)];
const isPlanLevel=()=>state.path.length===0;
const isCatLevel=()=>state.path.length===1;
const isExLevel=()=>state.path.length>=2;

/* ================= 动作参数 / 记组 公共助手 ================= */
const LBS2KG=0.45359237;
const trimNum=n=>{ n=+n; return isFinite(n)? String(Math.round(n*100)/100):'0'; };
const unitOf=(s,t)=> (s&&s.u) || (t&&t.ex&&t.ex.unit) || 'kg';
const kgOfSet=s=> +(((+s.w||0) * (unitOf(s)==='lbs'?LBS2KG:1)).toFixed(1));
// Epley 公式估算 1RM
const e1RMw=(w,r)=> (w>0&&r>0)? w*(1+r/30) : 0;
// 目标参数摘要：4×12 · 70lbs（极限85）· RPE8 · 休90s
function exSummary(t){
  const e=t&&t.ex; if(!e) return '';
  const parts=[];
  if(e.sets&&e.reps) parts.push(e.sets+'×'+e.reps);
  else if(e.sets) parts.push(e.sets+'组');
  else if(e.reps) parts.push('×'+e.reps);
  if(e.weight!=null) parts.push(trimNum(e.weight)+(e.unit||'kg')+(e.maxWeight!=null?('（极限'+trimNum(e.maxWeight)+'）'):''));
  else if(e.maxWeight!=null) parts.push('极限'+trimNum(e.maxWeight)+(e.unit||'kg'));
  if(e.rpe) parts.push('RPE'+trimNum(e.rpe));
  if(e.restSec) parts.push('休'+e.restSec+'s');
  return parts.join(' · ');
}
// 单组文本：70lbs×12@8（每组都带单位）
function fmtSet(s){
  let str=trimNum(s.w)+unitOf(s)+'×'+trimNum(s.r);
  if(s.rpe) str+='@'+trimNum(s.rpe);
  return str;
}
// 完整链路名：方案>栏目>动作
function fullChainNames(id){
  function walk(node, chain){
    if(!node) return null;
    const next=chain.concat([node.name||'未命名']);
    if(node.id===id) return next;
    for(const s of (node.subs||[])){ const r=walk(s,next); if(r) return r; }
    return null;
  }
  for(const p of (D.plans||[])){ const r=walk(p,[]); if(r) return r; }
  return null;
}
// 某动作的历史记录（仅含记组数据），按时间升序
function entriesForEx(t){
  const out=[]; const suffix='>'+(t.name||'');
  Object.keys(ACT.logs||{}).forEach(day=>{
    (ACT.logs[day]||[]).forEach(e=>{
      if(!e||!e.label) return;
      const hasSets=e.sets&&e.sets.length;
      if(e.exId===t.id || (!e.exId&&hasSets&&e.label.endsWith(suffix))) out.push({day,e});
    });
  });
  out.sort((a,b)=>((a.e.ts||0)-(b.e.ts||0)) || (a.day<b.day?-1:1));
  return out;
}
// 正式组（排除热身；全热身则视为正式）
function workSets(entry){
  const s=(entry&&entry.sets)||[]; const w=s.filter(x=>!x.wu);
  return w.length?w:s;
}
function topSetOf(entry){
  const ws=workSets(entry); if(!ws.length) return null;
  return ws.reduce((a,b)=> kgOfSet(b)>=kgOfSet(a)?b:a);
}
function tonnageKg(entry){
  return Math.round(workSets(entry).reduce((sum,s)=>sum+kgOfSet(s)*(+s.r||0),0));
}
// 历史最重正式组（PR）
function prSetOf(entries){
  let best=null;
  entries.forEach(({e})=>{ workSets(e).forEach(s=>{ if(!best||kgOfSet(s)>kgOfSet(best)) best=s; }); });
  return best;
}
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 连续打卡天数（今天未练不断链，从昨天回溯）
function streakDays(){
  let n=0; const d=new Date();
  if(!actDayHas(dateKey(d))) d.setDate(d.getDate()-1);
  while(actDayHas(dateKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
// 同日同 label 去重写入（重新记组时替换旧记录；仅打卡不覆盖已有组数据）
function upsertActLog(day, entry){
  if(!ACT.logs) ACT.logs={};
  if(!ACT.logs[day]) ACT.logs[day]=[];
  const old=ACT.logs[day].find(x=>x&&x.label===entry.label);
  if(old && !entry.sets && old.sets) entry.sets=old.sets; // 保留之前的记组数据
  ACT.logs[day]=ACT.logs[day].filter(x=>!(x&&x.label===entry.label));
  ACT.logs[day].push(entry);
  ACT.days[day]=ACT.logs[day].length;
  persistAct();
}

/* ================= 渲染：磁贴页 ================= */
function renderTiles(){
  const list=getList();
  updateTopbar();
  $('#btnAdd').textContent='＋ 添加';
  $('#page-tiles').innerHTML = list.map((t,i)=>tileHTML(t,i,list)).join('') || emptyHTML();
}

/* 顶栏：三栏标题不同；仅计划栏可编辑标题、显示添加 */
function planTitle(){ return (D && D.title && String(D.title).trim()) || '多套健身方案'; }
function updateTopbar(){
  const page=state.page||'tiles';
  const titleEl=$('#topTitle');
  const addBtn=$('#btnAdd');
  const actions=$('#topActions');
  titleEl.classList.remove('editable');
  if(page==='tiles'){
    addBtn.style.display='';
    if(actions) actions.style.display='flex';
    if(state.path.length){
      titleEl.textContent=getPathNames().join(' › ');
    }else{
      titleEl.textContent=planTitle();
      titleEl.classList.add('editable');
    }
  }else if(page==='cal'){
    addBtn.style.display='none';
    if(actions) actions.style.display='none';
    titleEl.textContent='日历';
  }else{
    addBtn.style.display='none';
    if(actions) actions.style.display='none';
    titleEl.textContent='个人';
  }
}
function emptyHTML(){
  const tip = isPlanLevel()? '还没有健身方案，点击右上角“＋ 添加”创建': isCatLevel()? '这个方案还没有栏目，点击“＋ 添加”创建栏目':'这个栏目还没有动作，点击“＋ 添加”添加动作';
  return `<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:14px">${tip}</div>`;
}
function tileHTML(t,i){
  const cn = isCatLevel();           // 栏目层 → 显示“运动/结束”
  const sessionOn = workout[t.id];
  const kids = (t.subs&&t.subs.length)? t.subs.length:null;
  const hasKids = kids!=null;
  // 动作层：目标参数 + 历史（上次/PR）第二行
  const exs = exSummary(t);
  let hist='';
  if(isExLevel() && isLeaf(t)){
    const entries=entriesForEx(t);
    if(entries.length){
      const lastTop=topSetOf(entries[entries.length-1].e);
      const pr=prSetOf(entries);
      const parts=[];
      if(lastTop) parts.push('上次 '+fmtSet(lastTop));
      if(pr) parts.push('PR '+fmtSet(pr));
      parts.push(entries.length+'次');
      hist=parts.join(' · ');
    }
  }
  return `<div class="tile${t.done?' done':''}${sessionOn?' session':''}" data-id="${t.id}" style="--tc:${t.color}">
    <div class="tile-head">
      <span class="mini-chip" style="background:${t.color}">${esc(t.name[0]||'?')}</span>
      <span class="tile-name">${esc(t.name)}</span>
      ${hasKids?`<span class="cnt">${kids}项</span>`:''}
      ${cn?`<button class="wb-btn${sessionOn?' on':''}" data-wb="${t.id}">${sessionOn?'结束':'运动'}</button>`:''}
      <div class="tile-actions">
        <button class="drag-handle" data-handle="${t.id}" title="长按或拖动排序">≡</button>
        <button class="tile-btn set" data-set="${t.id}" title="编辑">⚙</button>
        <button class="tile-btn check${t.done?' on':''}" data-check="${t.id}">${t.done?'✓':'√'}</button>
        <button class="tile-btn del" data-del="${t.id}">✕</button>
      </div>
    </div>
    ${t.desc?`<div class="desc">${esc(t.desc)}</div>`:''}
    ${exs?`<div class="ex-line">${esc(exs)}</div>`:''}

// 统一文件格式：{ app:'yzfitness', version:1, plans:[...] }
const isNativeCap=()=> !!(window.Capacitor && window.Capacitor.isNativePlatform());

// 导出单个方案 → 生成JSON文件
function exportPlan(plan){
  const data={ app:'yzfitness', version:1, plans:[ JSON.parse(JSON.stringify(plan)) ] };
  const text=JSON.stringify(data,null,2);
  const fname= safeName(plan.name)+'-'+stamp()+'.yzplan.json';

  // 1) 原生：MediaStore 写入系统「下载」目录（Android 10+ 免存储权限，vivo/文件管理可见）
  // 2) 失败则写入应用缓存并调起系统分享，由用户保存到手机
  // 3) 提示文案只描述真实结果，不再谎称已进下载目录
  const saveNative=async ()=>{
    const Yz=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.YzExport;
    if(!Yz || !Yz.saveToDownloads) return false;
    try{
      const res=await Yz.saveToDownloads({ fileName:fname, content:text });
      const where=(res && res.path) ? res.path : '手机「下载」文件夹';
      msg('已导出「'+plan.name+'」\n位置：'+where+'\n可在系统文件管理的「下载」中查看。');
      return true;
    }catch(e){ return false; }
  };

  const shareFallback=async ()=>{
    try{
      const FS=window.Capacitor.Plugins.Filesystem;
      await FS.writeFile({ path:fname, data:text, directory:FS.Directory.Cache, encoding:FS.Encoding.UTF8 });
      let uri=fname;
      try{
        const got=await FS.getUri({ path:fname, directory:FS.Directory.Cache });
        uri=got && got.uri ? got.uri : fname;
      }catch(e){}
      await window.Capacitor.Plugins.Share.share({
        title:'导出健身方案',
        text:plan.name+'\n请在分享面板中选择「保存到文件 / 下载」',
        url:uri,
        dialogTitle:'分享 / 保存健身方案'
      });
      msg('已生成「'+plan.name+'」。\n若要留档，请在系统分享面板中选择「保存到文件」或「下载」。');
    }catch(err){
      msg('导出失败：'+(err && err.message ? err.message : '无法写入或分享文件'));
    }
  };

  const doShare=async ()=>{
    const ok=await saveNative();
    if(ok) return;
    if(isNativeCap()) await shareFallback();
    else{
      const blob=new Blob([text],{type:'application/json;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=fname; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      msg('已导出「'+plan.name+'」：'+fname);
    }
  };

  if(isNativeCap()) doShare();
  else{
    const blob=new Blob([text],{type:'application/json;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=fname; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    msg('已导出「'+plan.name+'」：'+fname);
  }
}
function safeName(s){ return (s||'方案').replace(/[\\/:*?"<>|]/g,'_').slice(0,20); }
function stamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }

// 校验并规范化导入的方案
function normalizePlans(raw){
  let obj;
  try{ obj=typeof raw==='string'? JSON.parse(raw): raw; }
  catch(e){ throw new Error('不是有效的JSON文件'); }
  const arr = Array.isArray(obj) ? obj : (Array.isArray(obj&&obj.plans)? obj.plans: null);
  if(!arr || !arr.length) throw new Error('文件里没有健身方案');
  // 逐条规范化：确保有 id/name/color/subs；动作参数 ex 透传
  const fixEx=e=>{
    if(!e||typeof e!=='object') return undefined;
    const o={};
    ['sets','reps','weight','maxWeight','rpe','restSec'].forEach(k=>{
      const n=parseFloat(e[k]); if(isFinite(n)&&n>=0) o[k]=Math.round(n*100)/100;
    });
    if(e.unit==='lbs') o.unit='lbs';
    return Object.keys(o).length? o:undefined;
  };
  const fix=(t, isPlan)=>{
    if(!t||typeof t!=='object') return null;
    t.id = t.id||uid();
    t.name = (t.name||'').trim()||'未命名';
    t.color = PALETTE.includes(t.color)? t.color : rndColor();
    t.done = !!t.done;
    t.desc = t.desc||undefined;
    t.ex = fixEx(t.ex);
    t.subs = Array.isArray(t.subs)? t.subs.map(s=>fix(s)).filter(Boolean) : [];
    return t;
  };
  return arr.map(p=>fix(p)).filter(Boolean);
}

function doImport(){
  const pick = (input)=>{
    input.type='file'; input.accept='.json,.yzplan,application/json';
    input.onchange=e=>{ const f=e.target.files[0]; if(!f) return; readFileToImport(f); };
    input.click();
  };
  if(isNativeCap()){
    try{
      const inp=document.createElement('input');
      document.body.appendChild(inp);
      pick(inp);
      setTimeout(()=>inp.remove(), 10000);
    }catch(e){ msg('无法打开文件选择器'); }
  }else{
    const inp=document.createElement('input');
    document.body.appendChild(inp);
    pick(inp);
    setTimeout(()=>inp.remove(), 10000);
  }
}
function readFileToImport(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{

      confirmModal('导入健身方案？',`将导入 ${list.length} 个方案：${list.map(p=>'「'+p.name+'」').join('、')}。导入后会添加到方案列表末尾。`, ()=>{

        msg('已导入 '+list.length+' 个方案');

    }catch(err){ msg('导入失败：'+err.message); }

  reader.readAsText(file, 'utf-8');
}

/* ================= 运动 / 结束 会话 ================= */
function toggleWorkout(catId){
  const cat=findNodeById(catId); if(!cat) return;
  if(!workout[catId]){
    // 开始：全子项置未打卡 + 栏目高亮
    setSubtreeDone(cat,false); cat.done=false;
    workout[catId]=true;
    addActLog(todayKey(), level2Label(catId), uid());
    logDay(todayKey());
  }else{
    // 结束：栏目及所有子项打卡
    setSubtreeDone(cat,true); cat.done=true;
    delete workout[catId];
    addActLog(todayKey(), level2Label(catId), uid());
    logDay(todayKey());
  }
  // 会话结束后整树重新推导，确保父级(方案)随栏目全打卡而自动打卡
  recomputeFromLevel(D.plans);
  save(); renderTiles(); renderCal();
}

/* ================= 记组（动作打卡记录） ================= */
let SR=null; // {t, rows:[{w,r,rpe,wu,u}]}
function openSetRecorder(t){
  SR={t, rows:[]};
  $('#srTitle').textContent='记组 · '+t.name;
  const exs=exSummary(t);
  $('#srTarget').textContent = exs? ('目标 '+exs) : '未设置训练参数，可直接记录实际组';
  $('#srUnit').textContent=(t.ex&&t.ex.unit)||'kg';
  $('#srWu').classList.remove('on');
  // 预填默认值：编辑动作里的参数优先（常规+极限都有 → 取极限），无参数再回退上次记录
  const e=t.ex||{};
  const entries=entriesForEx(t);
  const lastTop=entries.length? topSetOf(entries[entries.length-1].e):null;
  let w='',r='',p='';
  if(e.weight!=null||e.maxWeight!=null){
    w = (e.maxWeight!=null)? e.maxWeight : e.weight;
    if(e.reps!=null) r=e.reps;
    if(e.rpe!=null) p=e.rpe;
  }else if(lastTop){
    w=lastTop.w; r=lastTop.r; p=lastTop.rpe!=null?lastTop.rpe:'';
    $('#srUnit').textContent=unitOf(lastTop);
  }
  $('#srW').value=w; $('#srR').value=r; $('#srP').value=p;
  renderSrList();
  showModal('ovSets');
}
function renderSrList(){

/* ================= 组间休息计时器 ================= */
let TMR={end:0,total:0,iv:null,fin:false};
// 原生计时插件（后台通知/结束提醒）；Web 环境无此插件则静默降级
const YzTimerPlugin=()=>{ try{ return (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.YzTimer)||null; }catch(e){ return null; } };
// 请求开始休息：已有倒计时 → 先弹窗确认再重置
function requestRest(sec){
  if(!(sec>0)) return;
  if(restActive()){
    confirmModal('重新开始休息计时？',`当前已有休息倒计时，将被重置为 ${sec} 秒。`,()=>doStartRest(sec),'重置');
  }else doStartRest(sec);
}
function doStartRest(sec){
  const bar=$('#timerBar');
  bar.classList.remove('hidden','done');
  $('#tbLabel').textContent='⏱ 组间休息';
  TMR.end=Date.now()+sec*1000;
  TMR.total=sec;
  TMR.fin=false;
  ensureTick();
  const P=YzTimerPlugin();
  if(P&&P.start){ try{ P.start({seconds:sec}); }catch(e){} }
  tickRest();
}
function ensureTick(){ clearInterval(TMR.iv); TMR.iv=setInterval(tickRest,200); }
function tickRest(){
  const left=Math.max(0,(TMR.end-Date.now())/1000);
  $('#tbTime').textContent=String(Math.ceil(left));
  $('#tbFill').style.width=Math.min(100,(left/TMR.total)*100)+'%';
  if(left<=0 && !TMR.fin){
    TMR.fin=true;
    clearInterval(TMR.iv); TMR.iv=null;
    $('#timerBar').classList.add('done');
    $('#tbLabel').textContent='💪 休息结束，开练！';
    ding();
    try{ navigator.vibrate && navigator.vibrate([200,120,200]); }catch(e){}
    // 不自动消失，等用户点 ✕ 关闭
  }
}
function stopRest(){
  clearInterval(TMR.iv); TMR.iv=null; TMR.fin=false;
  $('#timerBar').classList.add('hidden');
  $('#timerBar').classList.remove('done');
  $('#tbLabel').textContent='⏱ 组间休息';
  const P=YzTimerPlugin();
  if(P&&P.stop){ try{ P.stop(); }catch(e){} }
}
const restActive=()=> !$('#timerBar').classList.contains('hidden');
// 把网页端当前剩余时间同步给原生计时器（±15s 调整后调用，保证通知栏一致）
function syncNativeRest(){
  const P=YzTimerPlugin();
  if(!P||!P.start) return;
  const left=Math.max(0,Math.ceil((TMR.end-Date.now())/1000));
  if(left>0){ try{ P.start({seconds:left}); }catch(e){} }
}
$('#tbPlus').addEventListener('click',()=>{
  if(!restActive())return;
  if(TMR.fin){ // 已结束的条上 +15 → 重新开始计时
    $('#timerBar').classList.remove('done');
    $('#tbLabel').textContent='⏱ 组间休息';
    TMR.fin=false;
    TMR.end=Date.now()+15000;
  }else TMR.end+=15000;
  TMR.total+=15;
  ensureTick(); tickRest(); syncNativeRest();
});
$('#tbMinus').addEventListener('click',()=>{
  if(!restActive()||TMR.fin)return;
  TMR.end=Math.max(Date.now()+1000,TMR.end-15000);
  ensureTick(); tickRest(); syncNativeRest();
});
$('#tbStop').addEventListener('click',stopRest);
// 前台结束提示音：「叮—叮」
function ding(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC(); const t=ac.currentTime;
    [[880,0],[1174.66,0.18]].forEach(a=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=a[0];
      g.gain.setValueAtTime(0.0001,t+a[1]);
      g.gain.exponentialRampToValueAtTime(0.3,t+a[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+a[1]+0.5);
      o.connect(g); g.connect(ac.destination);
      o.start(t+a[1]); o.stop(t+a[1]+0.55);
    });
    setTimeout(()=>{ try{ac.close();}catch(e){} },1500);
  }catch(e){}
}
// 回前台时立即校准倒计时显示（后台标记由原生生命周期自行维护，不经网页回传）
try{
  const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp&&CapApp.addListener){
    CapApp.addListener('appStateChange',(st)=>{
      if(st.isActive) tickRest();
    });
  }
}catch(e){}

function lineChartSvg(vals, labels){
  const W=272,H=96,P=8,PL=30; // PL: 左侧刻度文字宽度
  let mx=Math.max(...vals), mn=Math.min(...vals);
  if(mx===mn){ mx+=1; mn-=1; } // 数值全等时撑开区间，折线居中不贴轴
  const span=mx-mn;
  const px=i=> P+PL+((W-P-PL-4)*(vals.length===1?0.5:i/(vals.length-1)));
  const py=v=> H-P-((H-2*P-12)*((v-mn)/span));
  const pts=vals.map((v,i)=>[px(i),py(v)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#4f6ef7"/>`).join('');
  const lastPt=pts[pts.length-1];
  const lastLab=`<text x="${W-P}" y="${Math.max(10,lastPt[1]-6).toFixed(1)}" font-size="10" fill="#4f6ef7" text-anchor="end">${trimNum(vals[vals.length-1])}kg</text>`;
  const yMax=`<text x="2" y="${(py(mx)+3).toFixed(1)}" font-size="8" fill="#9aa3b2">${trimNum(mx)}</text>`;
  const yMin=`<text x="2" y="${(py(mn)+3).toFixed(1)}" font-size="8" fill="#9aa3b2">${trimNum(mn)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${P+PL-4}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e5e7eb" stroke-width="1"/>
    <polyline points="${line}" fill="none" stroke="#4f6ef7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastLab}${yMax}${yMin}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);padding:0 4px 0 ${PL+4}px"><span>${labels[0]||''}</span><span>${labels[labels.length-1]||''}</span></div>`;
}

function actData(){

function logDay(k){ if(!ACT.days[k]) ACT.days[k]=0; ACT.days[k]++; persistAct(); }

/* 以「方案>栏目」记录一条运动打卡（允许同日重复多条） */
function level2Label(id){
  function walk(node, chain){
    if(!node) return null;
    const next=chain.concat([node.name||'未命名']);
    if(node.id===id) return next;
    for(const s of (node.subs||[])){ const r=walk(s,next); if(r) return r; }
    return null;
  }
  let names=null;
  for(const p of (D.plans||[])){ names=walk(p,[]); if(names) break; }
  if(!names||!names.length) return '未知';
  if(names.length===1) return names[0];
  return names[0]+'>'+names[1];
}
function addActLog(day, label, id){
  if(!ACT.logs) ACT.logs={};
  if(!ACT.logs[day]) ACT.logs[day]=[];
  // 同一天同一打卡内容只保留一条
  if(ACT.logs[day].some(x=>x&&x.label===label)) return;
  ACT.logs[day].push({ id:id||uid(), label:label, ts:Date.now() });
  if(!ACT.days[day]) ACT.days[day]=0;
  ACT.days[day]=ACT.logs[day].length;
  persistAct();
}
function actDayHas(k){
  return ((ACT.logs&&ACT.logs[k]&&ACT.logs[k].length)>0) || ((ACT.days&&ACT.days[k]||0)>0);
}
function doneDaysCount(){
  const set=new Set();
  Object.keys(ACT.days||{}).forEach(k=>{ if((ACT.days[k]||0)>0) set.add(k); });
  Object.keys(ACT.logs||{}).forEach(k=>{ if((ACT.logs[k]||[]).length>0) set.add(k); });
  return set.size;
}

    // 记组数据：每组成一个小 chip + 当日总容量

/* ================= 训练统计 ================= */
function openStats(){
  const allDays=Object.keys(ACT.logs||{}).filter(k=>(ACT.logs[k]||[]).length);
  const streak=streakDays();
  const now=new Date();
  const prefix=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  // 本月汇总
  let monthDays=0, monthSets=0, monthKg=0;
  Object.keys(ACT.logs||{}).forEach(day=>{
    if(!day.startsWith(prefix)) return;
    if((ACT.logs[day]||[]).length) monthDays++;
    ACT.logs[day].forEach(e=>{ if(e.sets&&e.sets.length){ monthSets+=workSets(e).length; monthKg+=tonnageKg(e); } });
  });
  // 近6周容量（周一为一周开始，含本周）
  const monday=new Date(now); monday.setDate(now.getDate()-((now.getDay()+6)%7));
  const weeks=[];
  for(let i=5;i>=0;i--){
    const s=new Date(monday); s.setDate(monday.getDate()-7*i);
    const e=new Date(s); e.setDate(s.getDate()+6);
    const sk=dateKey(s), ek=dateKey(e);
    let kg=0;
    Object.keys(ACT.logs||{}).forEach(day=>{
      if(day>=sk&&day<=ek) (ACT.logs[day]||[]).forEach(x=>{ if(x.sets&&x.sets.length) kg+=tonnageKg(x); });
    });
    weeks.push({label:(s.getMonth()+1)+'/'+s.getDate(), kg});
  }
  const maxW=Math.max(1,...weeks.map(w=>w.kg));
  const bars=weeks.map(w=>`<div class="st-bar">
      <span class="vv">${w.kg?Math.round(w.kg):''}</span>
      <i style="height:${Math.max(2,(w.kg/maxW)*70)}px"></i>
      <span class="lb">${w.label}</span>
    </div>`).join('');
  // 部位占比：近90天按「栏目」聚合容量
  const cut=new Date(); cut.setDate(cut.getDate()-90);
  const cutStr=dateKey(cut);
  const catMap={};
  Object.keys(ACT.logs||{}).forEach(day=>{
    if(day<cutStr) return;
    (ACT.logs[day]||[]).forEach(e=>{
      if(!e.sets||!e.sets.length) return;
      const parts=(e.label||'').split('>');
      const cat=parts[1]||parts[0]||'其他';
      catMap[cat]=(catMap[cat]||0)+tonnageKg(e);
    });
  });
  const cats=Object.keys(catMap).map(k=>({k,v:catMap[k]})).sort((a,b)=>b.v-a.v).slice(0,6);
  const catTot=cats.reduce((s,c)=>s+c.v,0)||1;
  const catColor={};
  for(const p of (D.plans||[])) for(const c of (p.subs||[])) if(c&&c.name) catColor[c.name]=c.color;
  const catBars=cats.length? cats.map(c=>`<div class="st-cat">
      <span class="nm">${esc(c.k)}</span>
      <span class="bar-bg"><i style="width:${Math.round(c.v/catTot*100)}%;background:${catColor[c.k]||'#4f6ef7'}"></i></span>
      <span class="pct">${Math.round(c.v/catTot*100)}%</span>
    </div>`).join('') : '<p style="color:var(--muted);font-size:12px;padding:4px 0">近90天暂无记组数据</p>';
  const fmtKg=n=> n>=10000? (n/1000).toFixed(1)+'t' : String(Math.round(n));
  $('#stBody').innerHTML=`
    <div class="st-nums">
      <div class="st-num"><div class="v">${streak}</div><div class="k">连续打卡(天)</div></div>
      <div class="st-num"><div class="v">${allDays.length}</div><div class="k">累计打卡(天)</div></div>
      <div class="st-num"><div class="v">${monthDays}</div><div class="k">本月训练(天)</div></div>
    </div>
    <div class="st-sec">本月：正式组 <b style="color:var(--txt)">${monthSets}</b> 组 · 容量 <b style="color:var(--txt)">${fmtKg(monthKg)}</b> kg（lbs 按公制换算）</div>
    <div class="st-sec">近6周训练容量（kg）</div>
    <div class="st-bars">${bars}</div>
    <div class="st-sec">近90天部位容量占比</div>
    ${catBars}`;
  showModal('ovStats');
}

function exportActivity(){
  const data={ app:'yzfitness-activity', version:1, activity: JSON.parse(JSON.stringify({ days:ACT.days||{}, logs:ACT.logs||{} })) };
  const text=JSON.stringify(data,null,2);
  const fname='运动数据-'+stamp()+'.yzact.json';
  const saveNative=async ()=>{
    const Yz=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.YzExport;
    if(!Yz || !Yz.saveToDownloads) return false;
    try{
      const res=await Yz.saveToDownloads({ fileName:fname, content:text });
      const where=(res && res.path)? res.path : '手机「下载」文件夹';
      msg('已导出运动数据\n位置：'+where);
      return true;
    }catch(e){ return false; }
  };
  const shareFallback=async ()=>{
    try{
      const FS=window.Capacitor.Plugins.Filesystem;
      await FS.writeFile({ path:fname, data:text, directory:FS.Directory.Cache, encoding:FS.Encoding.UTF8 });
      let uri=fname;
      try{ const got=await FS.getUri({ path:fname, directory:FS.Directory.Cache }); uri=(got&&got.uri)||fname; }catch(e){}
      await window.Capacitor.Plugins.Share.share({
        title:'导出运动数据', text:'请在分享面板中保存到文件/下载', url:uri, dialogTitle:'分享 / 保存运动数据'
      });
      msg('已生成运动数据文件，请在分享面板中保存。');
    }catch(err){ msg('导出失败：'+(err&&err.message?err.message:'无法写入或分享')); }
  };
  const run=async ()=>{
    const ok=await saveNative();
    if(ok) return;
    if(isNativeCap()) await shareFallback();
    else{
      const blob=new Blob([text],{type:'application/json;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=fname; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      msg('已导出运动数据：'+fname);
    }
  };
  run();
}
function doImportActivity(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.yzact.json,.json,application/json';
  input.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        const act=(obj&&obj.activity)||obj;
        if(!act || (!act.logs && !act.days)) throw new Error('不是有效的运动数据文件');
        const logs=act.logs||{};
        const days=act.days||{};
        const dayCount=Object.keys(logs).length;
        confirmModal('导入运动数据？',
          `将导入 ${dayCount} 个打卡日的数据。同日记录会追加，现有记录保留。`,
          ()=>{
            if(!ACT.logs) ACT.logs={};
            if(!ACT.days) ACT.days={};
            Object.keys(logs).forEach(k=>{
              const arr=logs[k]||[];
              if(!ACT.logs[k]) ACT.logs[k]=[];
              arr.forEach(item=>{
                if(item&&typeof item==='object'){
                  const label=item.label||'未知';
                  // 同日同内容只保留一条
                  if(!ACT.logs[k].some(x=>x&&x.label===label)){
                    const ent={ id:item.id||uid(), label, ts:item.ts||Date.now() };
                    if(item.exId) ent.exId=item.exId;
                    // 组记录：重量×次数×RPE×热身×单位
                    if(Array.isArray(item.sets)&&item.sets.length){
                      ent.sets=item.sets.filter(s=>s&&isFinite(+s.w)&&isFinite(+s.r)).map(s=>({
                        w:+s.w, r:+s.r,
                        rpe:(s.rpe!=null&&isFinite(+s.rpe))? Math.round(+s.rpe*10)/10 : undefined,
                        wu:!!s.wu, u:(s.u==='lbs')?'lbs':'kg'
                      }));
                    }
                    ACT.logs[k].push(ent);
                  }
                }
              });
              ACT.days[k]=ACT.logs[k].length;
            });
            Object.keys(days).forEach(k=>{
              if(!ACT.days[k] && (days[k]||0)>0) ACT.days[k]=days[k];
            });
            persistAct();
            hideModal('ovTransfer');
            renderCal();
            msg('已导入运动数据');
          },'导入');
      }catch(err){ msg('导入失败：'+err.message); }
    };
    reader.readAsText(f,'utf-8');
  };
  document.body.appendChild(input);
  setTimeout(()=>input.remove(),10000);
  input.click();
}

/* ================= 拖拽排序 + 自管滚动 ================= */
/* 磁贴 touch-action:none，浏览器不再抢手势；列表滚动由 JS 实现，拖拽才能真正跟手 */
let dragActive=false, dragData=null;
let suppressClickUntil=0;

function lockScroll(on){
  document.documentElement.classList.toggle('drag-lock', !!on);
  const list=document.getElementById('page-tiles');
  if(list){
    if(on){ list.style.overflowY='hidden'; list.style.touchAction='none'; }
    else{ list.style.overflowY='auto'; list.style.touchAction='none'; }
  }
}

function setupDrag(){
  const container=$('#page-tiles');
  // 滚动容器是计划页自己，避免和日历/我的页抢同一 scrollTop
  const scroller=document.getElementById('page-tiles');
  let tile=null, pressTimer=null;
  let startX=0, startY=0, lastX=0, lastY=0;
  let started=false, moved=false, activeId=0;
  // 自管滚动状态
  let scrolling=false, scrollStartY=0, scrollStartTop=0, scrollLastY=0, scrollLastT=0, scrollV=0;

  const isDragTarget=(e)=>{
    const handle=e.target.closest && e.target.closest('[data-handle]');
    if(handle) return handle.closest('.tile');
    const el=e.target.closest && e.target.closest('.tile');
    if(!el) return null;
    // 按钮不作为拖拽起点（排序把手除外）
    if(e.target.closest('button') && !handle) return null;
    return el;
  };

  const onMove=(e)=>{
    // 明细列表/我的页等原生滚动区域：完全不拦截
    if(e.target && e.target.closest && e.target.closest('.cal-log-list,#page-me')) return;
    if(started && dragData){
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
      const t=e.touches? e.touches[0] : e;
      if(t){ lastX=t.clientX; lastY=t.clientY; dragMove(t); }
      return;
    }
    // 自管滚动：touch-action:none 下原生滚动被关，这里手动滚
    if(scrolling && scroller && e.touches && e.touches[0]){
      if(e.cancelable) e.preventDefault();
      const y=e.touches[0].clientY;
      const now=performance.now();
      const dy=y-scrollLastY;
      const dt=Math.max(now-scrollLastT, 1);
      scrollV=dy/dt;
      scroller.scrollTop = scrollStartTop - (y - scrollStartY);
      scrollLastY=y; scrollLastT=now;
    }
  };
  // 两个阶段都要非 passive，才能 preventDefault
  document.addEventListener('touchmove', onMove, {passive:false, capture:true});

  container.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    if(e.target.closest('.cal-day')) return;

    const t=e.touches[0];
    startX=lastX=t.clientX; startY=lastY=t.clientY;
    moved=false; started=false;
    tile=null;

    // 开始自管滚动（手指在列表上）
    scrolling=true;
    scrollStartY=t.clientY;
    scrollStartTop=scroller? scroller.scrollTop : 0;
    scrollLastY=t.clientY;
    scrollLastT=performance.now();
    scrollV=0;

    const el=isDragTarget(e);
    if(!el) return;
    // handle starts immediately in a separate listener; do not also arm long-press
    if(e.target.closest('[data-handle]')) return;
    tile=el;

    const myId=++activeId;
    clearTimeout(pressTimer);
    pressTimer=setTimeout(()=>{
      if(myId!==activeId || moved || !tile) return;
      started=true; dragActive=true; scrolling=false;
      beginDrag(tile, {clientX:lastX, clientY:lastY});
      lockScroll(true);
    }, 320);
  }, {passive:true});

  container.addEventListener('touchmove', e=>{
    if(started) return;
    const t=e.touches[0]; if(!t) return;
    lastX=t.clientX; lastY=t.clientY;
    if(Math.abs(t.clientX-startX)+Math.abs(t.clientY-startY)>10){
      moved=true;
      clearTimeout(pressTimer);
    }
  }, {passive:true});

  // 把手：立即可拖（不必等长按），跟手更稳
  container.addEventListener('touchstart', e=>{
    const handle=e.target.closest && e.target.closest('[data-handle]');
    if(!handle || e.touches.length!==1) return;
    const el=handle.closest('.tile');
    if(!el) return;
    const t=e.touches[0];
    tile=el; moved=false; started=true; dragActive=true; scrolling=false;
    lastX=t.clientX; lastY=t.clientY;
    clearTimeout(pressTimer);
    beginDrag(el, {clientX:t.clientX, clientY:t.clientY});
    lockScroll(true);
  }, {passive:true});

  const fin=(e)=>{
    if(started && e && e.touches && e.touches.length>0) return;
    clearTimeout(pressTimer);
    activeId++;
    if(started && dragData){
      endDrag();
      suppressClickUntil=Date.now()+350;
    }
    // 惯性滚动
    if(scrolling && scroller && !dragActive && Math.abs(scrollV)>0.05){
      let v=scrollV*16;
      const step=()=>{
        if(Math.abs(v)<0.2) return;
        scroller.scrollTop -= v;
        v*=0.95;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    scrolling=false;
    lockScroll(false);
    started=false; moved=false; tile=null; dragActive=false;
  };
  window.addEventListener('touchend', fin);
  window.addEventListener('touchcancel', fin);
}

function beginDrag(tile, ev){
  const list=getList();
  const idx=list.findIndex(t=>t.id===tile.dataset.id);
  if(idx<0){ dragData=null; return; }
  const rect=tile.getBoundingClientRect();
  const ph=document.createElement('div');
  ph.className='tile-placeholder';
  ph.style.height=rect.height+'px';
  ph.style.marginBottom='10px';
  tile.parentNode.insertBefore(ph, tile);
  tile.classList.add('dragging');
  tile.style.width=rect.width+'px';
  tile.style.margin='0';
  tile.style.position='fixed';
  tile.style.left=rect.left+'px';
  tile.style.top=rect.top+'px';
  tile.style.zIndex='900';
  tile.style.transition='none';
  tile.style.touchAction='none';
  tile.style.transform='translate3d(0,0,0)';
  dragData={
    tile, list, idx, ph, curIdx:idx,
    rect,
    grabX: ev.clientX - rect.left,
    grabY: ev.clientY - rect.top,
    dx:0, dy:0
  };
  applyDragTransform(ev.clientX, ev.clientY);
}

function applyDragTransform(clientX, clientY){
  const d=dragData; if(!d) return;
  d.dx = clientX - d.grabX - d.rect.left;
  d.dy = clientY - d.grabY - d.rect.top;
  d.tile.style.transform=`translate3d(${d.dx}px, ${d.dy}px, 0)`;
}

function dragMove(ev){
  const d=dragData; if(!d) return;
  applyDragTransform(ev.clientX, ev.clientY);
  const now=ev.clientY;
  const others=$$('#page-tiles .tile').filter(el=>el!==d.tile);
  let above=0;
  others.forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top + r.height/2 < now) above++;
  });
  const expected=Math.min(above, Math.max(d.list.length-1, 0));
  if(expected===d.curIdx) return;
  const parent=d.ph.parentNode;
  if(!parent) return;
  const phEl=d.ph;
  parent.removeChild(phEl);
  const others2=[...parent.children].filter(c=>c.classList.contains('tile') && c!==d.tile);
  const anchor = others2[expected] || null;
  if(anchor) parent.insertBefore(phEl, anchor);
  else parent.appendChild(phEl);
  d.curIdx=expected;
  animateReflow(d.tile);
}

function animateReflow(dragTile){
  const parent=dragTile.parentNode;
  if(!parent) return;
  const nodes=[...parent.children].filter(c=>c.classList.contains('tile')&&c!==dragTile);
  const prev=new Map(); nodes.forEach(n=>prev.set(n, n.getBoundingClientRect().top));
  requestAnimationFrame(()=>{
    nodes.forEach(n=>{
      const now=n.getBoundingClientRect().top; const p=prev.get(n); const dy=p-now;
      if(Math.abs(dy)>0.5){
        n.classList.add('reflowing');
        n.style.transform=`translateY(${dy}px)`;
      }
    });
    requestAnimationFrame(()=>{
      nodes.forEach(n=>{
        if(n.classList.contains('reflowing')){
          n.style.transition='transform .18s ease';
          n.style.transform='';
          n.classList.remove('reflowing');
        }
      });
    });
  });
}

function endDrag(){
  const d=dragData; if(!d) return;
  const [item]=d.list.splice(d.idx,1);
  d.list.splice(Math.min(d.curIdx, d.list.length),0,item);
  const tile=d.tile;
  tile.style.position=''; tile.style.left=''; tile.style.top=''; tile.style.width='';
  tile.style.margin=''; tile.style.zIndex=''; tile.style.transition='';
  tile.style.transform=''; tile.style.touchAction='';
  tile.classList.remove('dragging');
  if(d.ph && d.ph.parentNode) d.ph.remove();
  save();
  dragActive=false; dragData=null;
  renderTiles();
}

setupDrag();
setupCalListScroll();

/* 日历打卡明细：框内 JS 滚动（不依赖父级 touch-action） */
function setupCalListScroll(){
  const box=document.getElementById('calDetail');
  if(!box) return;
  let active=false, startY=0, startTop=0, lastY=0, lastT=0, vel=0, list=null;
  const pickList=(e)=>{
    const t=e.target;
    return t && t.closest ? t.closest('.cal-log-list') : null;
  };
  box.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    list=pickList(e);
    if(!list) return;
    active=true; startY=lastY=e.touches[0].clientY;
    startTop=list.scrollTop; lastT=performance.now(); vel=0;
  }, {passive:true});
  box.addEventListener('touchmove', e=>{
    if(!active || !list || e.touches.length!==1) return;
    if(e.cancelable) e.preventDefault();
    const y=e.touches[0].clientY;
    list.scrollTop=startTop-(y-startY);
    const now=performance.now();
    vel=(y-lastY)/Math.max(now-lastT,1);
    lastY=y; lastT=now;
    e.stopPropagation();
  }, {passive:false});
  const end=()=>{
    if(active && list && Math.abs(vel)>0.05){
      const el=list; let v=vel*16;
      const step=()=>{
        if(Math.abs(v)<0.2) return;
        el.scrollTop -= v;
        v*=0.95;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    active=false; list=null;
  };
  box.addEventListener('touchend', end);
  box.addEventListener('touchcancel', end);
}
/* ===== 磁贴点击（点击进入子层/编辑），拖拽结束后屏蔽误触 ===== */
$('#page-tiles').addEventListener('click', e=>{
  if(Date.now()<suppressClickUntil){ e.stopImmediatePropagation(); return; }
  // 排序把手不进入编辑/下一级
  if(e.target.closest('[data-handle]')){ e.stopImmediatePropagation(); return; }
  const check=e.target.closest('[data-check]');
  if(check){ e.stopImmediatePropagation(); toggleCheck(check.dataset.check); return; }
  const del=e.target.closest('[data-del]');
  if(del){ e.stopImmediatePropagation(); startDelete(del.dataset.del); return; }
  const wb=e.target.closest('[data-wb]');
  if(wb){ e.stopImmediatePropagation(); toggleWorkout(wb.dataset.wb); return; }
  const setBtn=e.target.closest('[data-set]');
  if(setBtn){ e.stopImmediatePropagation(); const t=findNodeById(setBtn.dataset.set); if(t) openEdit(t); return; }
  const tile=e.target.closest('.tile');
  if(tile && !dragActive){
    e.stopImmediatePropagation();
    const t=findNodeById(tile.dataset.id);
    if(!t) return;
    // 方案层/栏目层是容器：空的也可进入继续添加；动作层点开详情（统计/趋势/历史）
    const canEnter = state.path.length < 2 || (Array.isArray(t.subs) && t.subs.length>0);
    if(canEnter){ state.path.push(t.id); renderTiles(); }
    else { openDetail(t); }
  }
});

/* ================= 初始化 ================= */
function init(){
  load();
  ACT=actData();
  workout={};
  renderTiles();
  renderCal();
  switchTab('tiles');
  // Android 物理返回键拦截：先关弹窗→退1级→回首页→进后台(不直接退出)
  try{
    const Cap = window.Capacitor;
    if(Cap && Cap.Plugins && Cap.Plugins.App){
      Cap.Plugins.App.addListener('backButton', ()=>{
        const openOverlay = document.querySelector('.overlay:not(.hidden)');
        if(openOverlay){ openOverlay.classList.add('hidden'); return; }
        if(state.page!=='tiles'){ switchTab('tiles'); return; }
        if(state.path.length){ state.path.pop(); renderTiles(); return; }
        // 最顶层：进后台而非退出
        Cap.Plugins.App.minimizeApp();
      });
    }
  }catch(e){}
  document.title='云舟健身 v1.6';
}
init();
</script>
